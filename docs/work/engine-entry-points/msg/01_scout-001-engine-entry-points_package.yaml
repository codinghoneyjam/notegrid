  cross_domain: true
  contract_mutation: true
  answers:
    blockers:
      - q_id: "B1"
        verdict: "EngineState (engine.rs:8-12) holds renderer: Option<Renderer<OscSynth>> and no raw schedule bytes; ng_engine_set_schedule (engine.rs:56-82) deserializes with Schedule::from_bytes (schedule.rs:250) and calls renderer.set_schedule(Schedule) (renderer.rs:103), which stores schedule: Option<Schedule> (renderer.rs:30) and privately builds tempo: Option<TempoMap> (renderer.rs:31 and 105-106). Renderer exposes no public tempo accessor; the public path is Renderer::schedule() -> Option<&Schedule> (renderer.rs:167) giving Schedule { sample_rate: u32, tempos: Vec<TempoEntry { tick: u32, mpq: u32, sample: u64 }> } (schedule.rs:44-48, 62-69). ng-wasm already depends on ng-timeline (Cargo.toml:13), so it rebuilds the map with TempoMap::from_mpq_segments(schedule.sample_rate, &[(tick, mpq)]) (tempo_map.rs:47) and converts with TempoMap::tick_to_sample(tick) -> u64 (tempo_map.rs:109); the real signature takes NO sr argument because sr is fixed at construction (the C2 text tick_to_sample(tick,sr) at 02_contracts.dsl:49 is stale). The conversion must use schedule.sample_rate, the sr ng_compile embedded (ng-wasm lib.rs:174), which equals the ng_engine_init sr in practice; using the schedule's own rate keeps the tempo table self-consistent. The result feeds renderer.set_loop(Some((s0, s1))) (renderer.rs:175). Template ng_engine_set_loop(start: f64, end: f64, enabled: u32) -> i32 (engine.rs:119-137) casts to u64; per DECISIONS.md 2026-10-09 the ticks variant is ng_engine_set_loop_ticks(start_tick: u32, end_tick: u32, enabled: u32) -> i32 (Tick = u32 per C0.1), the same C4 convention. Rebuilding through the public ng-timeline API is exactly the pattern renderer.rs:105-106 already uses, so no tempo math enters ng-wasm and R02.R02 stays intact."
        citations: ["crates/ng-wasm/src/engine.rs:8", "crates/ng-wasm/src/engine.rs:56", "crates/ng-wasm/src/engine.rs:119", "crates/ng-render/src/renderer.rs:103", "crates/ng-render/src/renderer.rs:167", "crates/ng-timeline/src/tempo_map.rs:47", "crates/ng-timeline/src/tempo_map.rs:109", "crates/ng-timeline/src/schedule.rs:44", "crates/ng-wasm/src/lib.rs:174", "crates/ng-wasm/Cargo.toml:13"]
      - q_id: "B2"
        verdict: "LaneMix lives in ng-render (mix.rs:5-13): { slot: Slot(u16); gain: f32, LINEAR 0..=1; pan: u8, 0..=127 with 64 = centre; reverb_send: u8, 0..=127; mute: bool; solo: bool }. gain is the only engine-unit field; pan and reverb_send stay document-scale integers (C0.4). No mix wire format exists: C5 declares the message {t:'mix', bytes} (02_contracts.dsl:97) but packages/playback/src/sync/types.ts:57-63 states no encoding is defined, and ng_engine_set_mix ignores (_ptr, _len) today (engine.rs:85-91). The deserialization precedent to copy is ng_engine_set_schedule -> Schedule::from_bytes (engine.rs:61; schedule.rs:250). The port side produces document units: MixRow { lane, volume, pan, send: 0..=127, muted } (types.ts:64-70) with the global solo rule already folded into muted (mix.ts:20-29), and DECISIONS.md 2026-10-09 makes PlaybackPort.apply the single boundary that speaks engine units. Renderer::set_mix(&[LaneMix]) (renderer.rs:133-147) applies gain ramps, pan and reverb sends and recomputes any_solo from the slice, so sending solo = false with mute = muted reproduces the document semantics exactly. Recommended payload: a fixed little-endian per-lane record { slot: u16, volume: u8, pan: u8, send: u8, flags: u8 with bit0 = mute }, with the volume / 127.0 -> gain conversion defined once, mirroring lane_mix (slot_mix.rs:50-59); where that conversion lives (port side per the DECISIONS entry, or a LaneMix::from_document helper in crates/ng-render/src/mix.rs) is the planner's call and must be recorded in DECISIONS.md."
        citations: ["crates/ng-render/src/mix.rs:5", "crates/ng-render/src/renderer.rs:133", "crates/ng-render/src/slot_mix.rs:50", "crates/ng-wasm/src/engine.rs:61", "crates/ng-wasm/src/engine.rs:85", "packages/playback/src/sync/types.ts:64", "packages/playback/src/sync/mix.ts:20", "spec/dsl/02_contracts.dsl:97"]
      - q_id: "B3"
        verdict: "Renderer::audition_on(&mut self, kind: LaneKind, program: u8, key: u8, vel: u8) (renderer.rs:223-227) calls synth.set_program(AUDITION_SLOT, kind, program) then synth.note_on(AUDITION_SLOT, key, vel) and bumps the saturating note_ons counter; Renderer::audition_off(&mut self, key: u8) (renderer.rs:229-232) calls synth.note_off(AUDITION_SLOT, key) and bumps note_offs. kind is ng_core::LaneKind { Melodic, Drum } (ng-core lib.rs:17-21); the TS policy sends 0 = melodic and 1 = drum (audition.ts:8-9) and the Rust mirror is kind_of (slot_mix.rs:43-48). key and vel are u8; C0.4 fixes pitch at 0..=127 and velocity at 1..=127 (the TS policy sends vel 0 only as its release sentinel and note_off ignores it). AUDITION_SLOT = Slot(128) with MAX_SLOTS = 129 (ng-core lib.rs:14-15): I-01 caps lanes at 128 (02_contracts.dsl:17) so schedule slots are 0..=127 and slot 128 is reserved, Schedule::validate enforces note.slot < lane_count (schedule.rs:172-200) so no scheduled note can ever target the audition lane, and OscSynth pre-allocates all 129 lanes (osc/mod.rs:354-357). render_block renders every active voice regardless of transport state (renderer.rs:376 -> osc/mod.rs:548-583), so an auditioned note sounds immediately even while stopped: the voice is driven by the ABI call, never by the schedule or the playhead, which is exactly the note-add / pitch-change requirement. No ng-synth change is needed."
        citations: ["crates/ng-render/src/renderer.rs:223", "crates/ng-render/src/renderer.rs:229", "crates/ng-core/src/lib.rs:14", "crates/ng-core/src/lib.rs:17", "crates/ng-timeline/src/schedule.rs:172", "crates/ng-synth/src/osc/mod.rs:354", "crates/ng-synth/src/osc/mod.rs:548", "packages/playback/src/sync/audition.ts:8", "spec/dsl/02_contracts.dsl:17"]
      - q_id: "B4"
        verdict: "All ng_engine_* functions share one static pub static ENGINE: Mutex<EngineState> (engine.rs:14-18; EngineState at engine.rs:8-12 holds renderer, sample_rate, max_voices), initialized once by ng_engine_init (engine.rs:21-53) as OscSynth::new(sr, voices) + MasterBus::new_default(sr) + Renderer::new(synth, master, RenderConfig::new(sr)) stored in e.renderer = Some(renderer). The per-function pattern is ENGINE.lock() -> if let Some(ref mut renderer) = e.renderer { mutate; 0 } else { set_error(\"E_ENGINE\", \"engine not initialized\"); negative code }, with mutex Err(_) mapped to a different negative code. The Synth is a private field of Renderer (renderer.rs:26) and is reached only through Renderer methods: set_mix and audition_on already call self.synth.set_pan / set_reverb_send / set_program / note_on (renderer.rs:133-147, 223-232). Error convention (C4, 02_contracts.dsl:78-79): every function returns i32, 0 = OK, negative = error, and the detail goes to ng_error_ptr/len as UTF-8 JSON {code,message} written by set_error (buffers.rs:9-14); there is no typed error enum, codes are per-function string conventions. The two stubs return -6 with code \"E_NOT_IMPLEMENTED\" (engine.rs:85-91 and 140-152); the new implementations replace the stubs, follow the same set_error + negative-i32 pattern, and validate pointer/length through read_bytes -> Option<&[u8]> (buffers.rs:37-42) so no trap can occur (C4.2, 02_contracts.dsl:92)."
        citations: ["crates/ng-wasm/src/engine.rs:14", "crates/ng-wasm/src/engine.rs:21", "crates/ng-wasm/src/engine.rs:56", "crates/ng-wasm/src/buffers.rs:9", "crates/ng-wasm/src/buffers.rs:37", "spec/dsl/02_contracts.dsl:78"]
    references_summary:
      - { group: "R1 ng-timeline public API and ng-wasm dependency", symbols: ["compile(&Project, sample_rate: u32) -> Result<Schedule, CompileError> (crates/ng-timeline/src/compile.rs:48)", "TempoMap::from_mpq_segments(sample_rate: u32, points: &[(Tick, u32)]) -> Result<Self, TempoMapError> (tempo_map.rs:47)", "TempoMap::from_project(&ng_score::Project, u32) (tempo_map.rs:91)", "TempoMap::tick_to_sample(&self, tick: Tick) -> u64 (tempo_map.rs:109)", "TempoMap::sample_to_tick(&self, sample: u64) -> Tick (tempo_map.rs:126)", "TempoMap::segments(&self) -> &[TempoSegment] (tempo_map.rs:103)", "Schedule::to_bytes(&self) -> Vec<u8> (schedule.rs:203)", "Schedule::from_bytes(bytes: &[u8]) -> Result<Self, ScheduleError> (schedule.rs:250)", "Schedule::new(u32, Vec<LaneEntry>, Vec<TempoEntry>, Vec<NoteEvent>) (schedule.rs:152)", "ng-wasm depends on ng-timeline (crates/ng-wasm/Cargo.toml:13; spec/dsl/01_system.dsl:59; crates/ng-wasm/src/engine.rs:5)"] }
      - { group: "R2 Renderer<S: Synth> (crates/ng-render/src/renderer.rs)", symbols: ["new(synth: S, master: MasterBus, cfg: RenderConfig) -> Self (:46)", "set_schedule(&mut self, schedule: Schedule) (:103)", "set_mix(&mut self, lanes: &[LaneMix]) (:133)", "set_loop(&mut self, range: Option<(u64, u64)>) (:175)", "audition_on(&mut self, kind: LaneKind, program: u8, key: u8, vel: u8) (:223)", "audition_off(&mut self, key: u8) (:229)", "render_block(&mut self, l: &mut [f32], r: &mut [f32]) -> BlockStatus (:305)", "schedule(&self) -> Option<&Schedule> (:167)", "play/pause/stop/seek(sample: u64), position() -> (u64, Tick), position_sample/position_tick, state, counters, dropped_offs, active_voices (:71-173)", "MasterBus::new_default(sample_rate: u32) -> Result<Self, MasterBusError> (crates/ng-render/src/master.rs:19)", "RenderConfig::new(sample_rate: u32) (transport.rs:18)", "BlockStatus { position_sample: u64, position_tick: Tick, playing: bool, ended: bool } (transport.rs:24)"] }
      - { group: "R3 LaneMix, RenderConfig, MasterBus", symbols: ["LaneMix { slot: ng_core::Slot, gain: f32 (linear 0..=1), pan: u8 (0..=127, 64 centre), reverb_send: u8 (0..=127), mute: bool, solo: bool } (crates/ng-render/src/mix.rs:5-13)", "RenderConfig { sample_rate: u32 } (crates/ng-render/src/transport.rs:13-22)", "MasterBus { reverb: Reverb, limiter: SoftLimiter } with new_default(u32) -> Result<Self, MasterBusError> (crates/ng-render/src/master.rs:8-25)", "set_mix consumes engine-unit gain f32 plus document-scale pan/send u8 and mute/solo flags; document integers become gain at the port boundary via volume / 127.0, the same conversion lane_mix applies for the schedule path (crates/ng-render/src/slot_mix.rs:50-59)"] }
      - { group: "R4 end-to-end ABI templates (crates/ng-wasm/src/engine.rs)", symbols: ["ng_engine_set_loop(start: f64, end: f64, enabled: u32) -> i32 (:119-137): locks ENGINE, range = if enabled != 0 { Some((start as u64, end as u64)) } else { None }, renderer.set_loop(range), 0; no renderer -> set_error E_ENGINE + -2; lock Err -> -3", "ng_engine_set_schedule(ptr: u32, len: u32) -> i32 (:56-82): read_bytes (None -> E_FORMAT -2), Schedule::from_bytes (Err -> E_FORMAT -3), lock, renderer.set_schedule(schedule), 0; no renderer -> -4; lock Err -> -5", "ng_engine_init(sr: u32, synth_kind: u32, max_voices: u32) -> i32 (:21-53): defaults sr 44100 / voices 64, synth_kind != 0 -> E_UNSUPPORTED -6, builds OscSynth + MasterBus + Renderer, stores ENGINE, 0; lock Err -> -7"] }
      - { group: "R5 NoteSink, ChannelMix, AudioSource, slots (crates/ng-core/src/lib.rs)", symbols: ["trait NoteSink { set_program(&mut self, Slot, LaneKind, u8); note_on(&mut self, Slot, u8, u8); note_off(&mut self, Slot, u8); release_all(); silence_all() } (:24-30)", "trait ChannelMix { set_gain(&mut self, Slot, f32); set_pan(&mut self, Slot, u8); set_reverb_send(&mut self, Slot, u8) } (:33-37)", "trait AudioSource { sample_rate(&self) -> u32; render(&mut self, out: &mut Buses); active_voices(&self) -> usize } (:47-51)", "trait Synth: NoteSink + ChannelMix + AudioSource + Send with blanket impl (:53-54)", "Slot(u16) (:12), MAX_SLOTS: usize = 129 (:14), AUDITION_SLOT: Slot = Slot(128) (:15), LaneKind { Melodic, Drum } (:18)", "OscSynth implements NoteSink (:476-510), ChannelMix (:512-534), AudioSource (:536-583) in crates/ng-synth/src/osc/mod.rs"] }
      - { group: "R6 TypeScript and worklet expectations", symbols: ["@ng/abi does NOT declare ng_engine_set_loop_ticks: WasmExports lists ng_engine_set_mix (packages/abi/src/index.ts:31), ng_engine_set_loop (:33), ng_engine_audition (:34); Ng has engineSetMix (:160-170), engineSetLoop (:177-180), engineAudition (:182-185); no engineSetLoopTicks exists anywhere", "PlaybackPort.apply(op: ReplayOp) (packages/playback/src/sync/types.ts:99-101) receives { op: mix, rows: MixRow[] }, { op: loop, range: LoopRange | null }, { op: schedule, bytes }, { op: init, sampleRate }, { op: bank, bytes }; REPLAY_ORDER = [init, schedule, mix, loop, bank] (transport.ts:16)", "the test EnginePort (sync.test.ts:91-133) forwards loop ticks verbatim into engineSetLoop (:106-111; the seam pinned by test T2.6 unit boundary at :363-386) and skips mix/bank (:116-118) and audition (:122-124) as E_NOT_IMPLEMENTED -- wiring those three ops is what this task unblocks", "C5 worklet messages (spec/dsl/02_contracts.dsl:97): {t:'schedule', bytes} {t:'mix', bytes} {t:'transport', cmd, arg} {t:'loop', start, end, enabled} {t:'audition', ...}"] }
  coverage_gaps_and_risks:
    - "Wire format gap (mix): C4 and C5 specify ng_engine_set_mix(ptr, len) and {t:'mix', bytes} but no payload layout; the planner must fix one (fixed little-endian per-lane record recommended), decide where volume / 127.0 -> gain lives (port side per DECISIONS.md 2026-10-09, or a single-definition LaneMix::from_document helper in crates/ng-render/src/mix.rs), and record the choice in DECISIONS.md."
    - "Forced coupling outside the stated crate scope: packages/abi/test/abi.test.ts:6-21 (gate g08) asserts the exact wasm export set, so adding ng_engine_set_loop_ticks REQUIRES editing that list, and packages/abi/src/index.ts needs the WasmExports entry plus an Ng.engineSetLoopTicks wrapper before TS can call it; the planner must widen the directive's three-crate scope to packages/abi/** or consciously defer the wrapper. Scale correction: the directive's scale_hint estimated tier 3 without source access; the survey finds LEN(affected_files) = 4 <= 10, so this is tier 1 / Mode C."
    - "Tempo conversion design choice: (a) ng-wasm rebuilds the TempoMap from renderer.schedule().tempos via TempoMap::from_mpq_segments (the exact renderer.rs:105-106 pattern, zero ng-render change, recommended) or (b) add a public Renderer tempo accessor (one small ng-render addition reusing the already-built map). Before any schedule is loaded renderer.schedule() is None, so ng_engine_set_loop_ticks must return an error code (planner picks, e.g. E_ENGINE) instead of silently succeeding."
    - "Stale contract text: C2 declares TempoMap::tick_to_sample(tick, sr) (spec/dsl/02_contracts.dsl:49) but the implemented signature fixes sr at construction (tempo_map.rs:47, 109); not a blocker because the public API fully supports the conversion, but the planner should correct the line while editing C4/C5 for the new export. ng-synth needs no change: OscSynth already owns the AUDITION_SLOT lane and renders active voices regardless of transport state."
