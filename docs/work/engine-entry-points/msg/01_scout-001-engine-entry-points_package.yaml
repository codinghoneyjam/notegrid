scout_package:
  role: "01_scout"
  slug: "engine-entry-points"
  directive_ref: "docs/work/engine-entry-points/msg/00_planner_directive-001-engine-entry-points.yaml"
  feasibility: 1
  scale: { tier: 1, mode: "Mode C" }
  fast_track_eligible: false
  affected_files:
    - "crates/ng-wasm/src/engine.rs"
    - "crates/ng-render/src/renderer.rs"
    - "packages/abi/src/index.ts"
